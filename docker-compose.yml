version: '3.8'

services:
  # FastAPI web application
  app:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount tmpfs for /tmp (memory-backed, auto-cleanup)
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 1G  # Limit to 1GB RAM
    restart: unless-stopped
